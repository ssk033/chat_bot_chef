name: Meal-IT CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mealit
          POSTGRES_PASSWORD: mealit123
          POSTGRES_DB: mealit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mealit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://mealit:mealit123@localhost:5432/mealit?schema=public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations (Test DB)
        run: npx prisma migrate deploy

      - name: Build Next.js Application
        run: npm run build

      - name: Downcase Repository Name for GHCR Compatibility
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/meal-it-app"
          echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Self-Hosted Runner
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR on Self-Hosted Runner
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Downcase Image Name for Compose
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_NAME=ghcr.io/$owner/meal-it-app"
          Add-Content -Path $env:GITHUB_ENV -Value "IMAGE_TAG=latest"

      - name: Generate Production .env from GitHub Secrets
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          @"
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}?schema=public
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CURSOR_API_KEY=${{ secrets.CURSOR_API_KEY }}
          IMAGE_NAME=ghcr.io/$owner/meal-it-app
          IMAGE_TAG=latest
          "@ | Out-File -FilePath "$env:GITHUB_WORKSPACE\.env" -Encoding ascii

      - name: Verify Workspace .env
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          if (Test-Path ".env") {
            Write-Host "========== .env Successfully Generated =========="
          } else {
            Write-Error ".env generation failed!"
            exit 1
          }

      - name: Pull Latest Docker Images from GHCR
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          docker compose pull

      - name: Deploy Containers Idempotently
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          docker compose up -d

      - name: Verify Container Health & Status
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          Write-Host "========== Container Status =========="
          docker ps
          
          Start-Sleep -Seconds 10
          $appContainer = docker ps --filter "name=app" --format "{{.Status}}"
          Write-Host "App Container Status: $appContainer"
          if ($appContainer -notlike "*Up*") {
            Write-Error "Deployment verification failed: App container is not in running state!"
            exit 1
          }
          Write-Host "========== Deployment Successful =========="