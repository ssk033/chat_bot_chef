name: Meal-IT CI

on:
  push:
    branches: [main, master]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mealit
          POSTGRES_PASSWORD: mealit123
          POSTGRES_DB: mealit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mealit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://mealit:mealit123@localhost:5432/mealit?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: docker build -t meal-it .

  deploy-local:
    needs: test-build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        shell: powershell
        run: |
          @"
          POSTGRES_USER=mealit
          POSTGRES_PASSWORD=mealit123
          POSTGRES_DB=mealit
          DATABASE_URL=postgresql://mealit:mealit123@postgres:5432/mealit?schema=public
          OLLAMA_BASE_URL=http://your-ollama-service.com:11434
          OLLAMA_MODEL=llama3.2:1b
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CURSOR_API_KEY=${{ secrets.CURSOR_API_KEY }}
          "@ | Out-File -FilePath "$env:GITHUB_WORKSPACE\.env" -Encoding ascii

      - name: Debug Workspace
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          cd $env:GITHUB_WORKSPACE
          Get-Location
          dir -Force

      - name: Check .env
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          if (Test-Path ".env") {
            Write-Host "========== .env FOUND =========="
            Get-Content .env
          } else {
            Write-Host "========== .env NOT FOUND =========="
            exit 1
          }

      - name: Stop old containers
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          docker compose down

      - name: Build and start latest containers
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          docker compose up --build -d

      - name: Verify deployment
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          docker ps